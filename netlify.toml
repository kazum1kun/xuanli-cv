[build]
  command = "npm run build"
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.166.0"
  NODE_VERSION = "22"
  GO_VERSION = "1.27.1"
  HUGO_ENVIRONMENT = "production"

[context.deploy-preview]
  command = 'hugo --minify --buildFuture --panicOnWarning --printPathWarnings --printI18nWarnings -b "$DEPLOY_PRIME_URL" && npm run pagefind'

[context.branch-deploy]
  command = 'hugo --minify --panicOnWarning --printPathWarnings --printI18nWarnings -b "$DEPLOY_PRIME_URL" && npm run pagefind'
