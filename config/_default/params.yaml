# Current configuration schema: https://hugoblox.com/templates/academic-cv
hugoblox:
  schema: '2.0'
  identity:
    name: Xuanli Lin
    type: person
    description: 'Research in network optimization, network security, artificial intelligence, and the Internet of Things at Arizona State University.'
  theme:
    mode: system
    pack: xlin
  typography:
    pack: xlin
  layout:
    radius: sm
    spacing: comfortable
    avatar_shape: circle
  header:
    enable: true
    style: navbar
    sticky: true
    align: left
    search: true
    theme_toggle: true
    theme_picker: false
    language_switcher: false
  footer:
    style: minimal
    language_switcher: false
  copyright:
    notice: '© {year} {name}. This work is licensed under {license}'
    license:
      type: cc
      allow_derivatives: false
      share_alike: true
      allow_commercial: false
  content:
    math:
      enable: false
    toc:
      enable: false
    reading_time:
      enable: false
    citations:
      style: apa
  search:
    enable: true
  comments:
    enable: false
  repository:
    enable: false
    url: 'https://github.com/kazum1kun/xuanli-cv'
    branch: main
    content_dir: content
  locale:
    date_format: 'Jan 2, 2006'
    time_format: '3:04 PM'
    address_format: en-us
