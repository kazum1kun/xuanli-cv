bio: |
  Nageswara S. V. Rao is a Corporate Fellow at Oak Ridge National Laboratory, which he joined in 1993. His research covers high-performance and quantum networking, information fusion, machine learning, and connected scientific instruments. He earned his PhD in computer science from Louisiana State University in 1988. He is an IEEE Fellow and a recipient of the IEEE Computer Society Technical Achievement Award and an R&D 100 Award.
