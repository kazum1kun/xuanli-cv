bio: |
  Kuai Xu is a professor of computer science in the School of Mathematical and Natural Sciences at Arizona State University. His research covers network security, network measurement and analysis, cloud computing, home networks, and online social networks. He received his PhD in Computer Science from the University of Minnesota in 2006 and his bachelor's and master's degrees in Computer Science from Peking University in 1998 and 2001, respectively.
