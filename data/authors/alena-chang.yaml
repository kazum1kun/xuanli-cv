bio: |
  Alena Chang is a research scientist at the Georgia Tech Research Institute, working in quantum research within the Cybersecurity, Information Protection, and Hardware Evaluation Research Laboratory. Chang's research includes algorithms for entanglement distribution in satellite-based quantum networks, including methods that account for satellite movement and inter-satellite links. Chang previously conducted research at Arizona State University's School of Computing and Augmented Intelligence.
