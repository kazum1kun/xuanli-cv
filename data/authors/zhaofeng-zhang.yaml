bio: |
  Zhaofeng Zhang is an assistant professor of computer science at Delaware State University. He works on edge computing, next-generation wireless networks, and machine learning. He earned a bachelor's degree in electrical engineering from Huazhong University of Science and Technology in 2015, followed by master's and PhD degrees in electrical engineering from Arizona State University in 2016 and 2023. He previously conducted postdoctoral research at ASU.
