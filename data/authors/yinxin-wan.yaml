bio: |
  Yinxin Wan is an assistant professor in the Department of Computer Science at the University of Massachusetts Boston. His research focuses on cybersecurity, secure and trustworthy artificial intelligence, network measurement, the Internet of Things, and quantum networking. He received his PhD in Computer Science from Arizona State University in 2023, advised by Guoliang Xue and Kuai Xu, and his bachelor's degree in Information Security from the University of Science and Technology of China.
