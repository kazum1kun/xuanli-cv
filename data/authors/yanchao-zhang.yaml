bio: |
  Yanchao Zhang is a professor in the School of Electrical, Computer and Energy Engineering at Arizona State University. He directs the Cyber and Network Security Group and the DoD Center of Excellence in Future Generation Wireless Technology. His research addresses security and privacy in networked systems, including wireless and mobile networks, the Internet of Things, and cloud and edge computing. He earned his PhD from the University of Florida in 2006 and is an IEEE Fellow.
