bio: |
  Feng Wang is a professor in the applied computing program in the School of Mathematical and Natural Sciences at Arizona State University. Her research spans network science, social media analysis, network optimization, network security, and wireless sensor networks. She received her PhD in Computer Science from the University of Minnesota, Twin Cities, in 2005, her master's degree in Computer Science from Peking University in 1999, and her bachelor's degree in Computer Science from Wuhan University in 1996. She joined Arizona State University in 2007.
