bio: |
  Kevin S. Chan is a lead research electronics engineer and Network Science Team Lead at the U.S. Army DEVCOM Army Research Laboratory. His research spans network science, edge computing, and cybersecurity. He holds a bachelor's degree from Carnegie Mellon University and master's and doctoral degrees in electrical and computer engineering from Georgia Tech. He received the IEEE Communications Society's Leonard G. Abraham Prize in 2021.
